name: soona
description: 'soona is an all-in-one creative platform for ecommerce brands that produces
  and manages product photography, video, and user-generated content (UGC). Brands can
  book virtual and in-studio photo and video shoots with vetted models, stylists, and
  photographers; generate on-brand content at scale with soona AI Studio; organize
  assets in a digital asset manager (DAM); and analyze listing performance and competitors
  with Listing Insights across Shopify, Amazon, Etsy, Walmart, Meta, and TikTok. soona
  is headquartered in Denver, Colorado, and acquired the generative-AI product photography
  startup Mokker (Zerolens GmbH) in March 2024. This profile was surfaced as a portfolio
  company of bain-capital-ventures, techstars, and union-square-ventures. Enrichment found
  no public developer API, OpenAPI, SDK or developer portal on any soona-controlled host as
  of August 2026: soona''s "integrations" with Shopify, Amazon, Google Drive, Dropbox and
  Contentful are user-configured product connections rather than developer APIs. The only
  API soona controls is the Mokker API, advertised at mokker.ai/api as "coming soon" behind
  an early-access form, whose advertised host api.mokker.ai no longer resolves.'
